[project]
name = "field-service-copilot"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "lxml>=6.1.3",
    "openai>=3.29.0",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.15.0",
    "pymupdf>=1.28.2",
    "python-dateutil>=2.9.0.post0",
    "python-docx>=1.2.0",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2",
    "structlog>=26.1.0",
    "tenacity>=9.2.1",
    "tiktoken>=0.14.0",
    "typer>=0.27.3",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[project.scripts]
copilot = "app.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
# B008: FastAPI Depends()/Typer Option() defaults are the frameworks' idiom.
# B023: the per-page flush() helpers are redefined and called inside the same loop iteration.
# FURB167: re.I / re.S are clearer than the long flag names here.
ignore = ["B008", "B023", "FURB167"]
